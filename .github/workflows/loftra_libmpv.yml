name: loftra libmpv (LGPL, x86_64)
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  push:
    branches: [loftra-lgpl]

env:
  BIT: x86_64
  CACHE_PREFIX: loftra-v1
  # Packages build and package sources caches (always saved together). Bump it to
  # start both from scratch. Without the sources cache the build stamps say
  # "downloaded" while src_packages is empty, so the update step runs git in the
  # workspace repo and fails on .git/index.lock (code 128).
  PACKAGES_PREFIX: loftra-p4

jobs:
  toolchain:
    name: Clang toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@v4

      - name: Loading clang root
        id: clang_root_cache
        uses: actions/cache/restore@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_PREFIX }}-clang_root

      - name: Loading x86_64 toolchain
        id: toolchain_cache
        uses: actions/cache/restore@v4
        with:
          path: build_x86_64
          key: ${{ env.CACHE_PREFIX }}-toolchain_x86_64

      - name: Building LLVM
        if: ${{ steps.clang_root_cache.outputs.cache-hit != 'true' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm

      - name: Building x86_64 toolchain
        if: ${{ steps.toolchain_cache.outputs.cache-hit != 'true' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm-clang
          rm -rf build_x86_64/{toolchain,packages} || true

      - name: Collecting logs
        if: failure()
        run: |
          mkdir -p logs
          cp -fr $(find build_x86_64 -type f -iname "*-*.log") logs || true

      - name: Uploading logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-logs
          path: logs
          retention-days: 3

      - name: Saving clang root
        if: ${{ steps.clang_root_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_PREFIX }}-clang_root

      - name: Saving x86_64 toolchain
        if: ${{ steps.toolchain_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build_x86_64
          key: ${{ env.CACHE_PREFIX }}-toolchain_x86_64

  libmpv:
    name: libmpv
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@v4

      - name: Loading clang root
        uses: actions/cache/restore@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_PREFIX }}-clang_root
          fail-on-cache-miss: true

      - name: Loading package sources
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          key: ${{ env.PACKAGES_PREFIX }}-sources-${{ github.run_id }}
          restore-keys: ${{ env.PACKAGES_PREFIX }}-sources-

      - name: Loading packages build
        id: packages_cache
        uses: actions/cache/restore@v4
        with:
          path: build_x86_64
          key: ${{ env.PACKAGES_PREFIX }}-packages_x86_64-${{ github.run_id }}
          restore-keys: ${{ env.PACKAGES_PREFIX }}-packages_x86_64-

      - name: Loading x86_64 toolchain
        if: ${{ steps.packages_cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v4
        with:
          path: build_x86_64
          key: ${{ env.CACHE_PREFIX }}-toolchain_x86_64
          fail-on-cache-miss: true

      - name: Configuring CMake and downloading sources
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DCLANG_PACKAGES_LTO=ON -G Ninja --fresh -B build_x86_64 -S $PWD
          ninja -C build_x86_64 download || true

      - name: Building mpv
        run: |
          ninja -C build_x86_64 update
          ninja -C build_x86_64 mpv

      - name: Checking license and decoders
        run: |
          for f in $(find build_x86_64 -type f -iname "ffmpeg-configure*.log"); do
            grep -m1 "^License:" "$f" || true
            for d in hap prores notchlc; do grep -qw "$d" "$f" && echo "decoder $d: listed" || echo "decoder $d: NOT FOUND"; done
          done
          # The HAP encoder is only built with libsnappy; fail the run without it.
          # The build dir is removed after install, so read the configure log
          # (the -out log; the -err log holds only warnings).
          log=$(find build_x86_64 -type f -iname "ffmpeg-configure-out.log" | head -1)
          echo "configure log: $log"
          grep -qw libsnappy "$log" && echo "libsnappy: enabled" || { echo "libsnappy: NOT ENABLED"; exit 1; }
          awk '/^Enabled encoders:/{f=1;next} f&&/^(Enabled|Disabled|$)/{exit} f' "$log" | grep -w hap >/dev/null \
            && echo "encoder hap: listed" || { echo "encoder hap: NOT FOUND"; exit 1; }
          for f in $(find build_x86_64 -type f -iname "mpv-configure*.log"); do
            grep -iE "^\s*gpl\s|gpl *: *(YES|NO)|Build-time license|User defined options" -A2 "$f" | head -20 || true
          done

      - name: Collecting output
        run: |
          mkdir -p out
          cp -r build_x86_64/mpv-dev-x86_64-* out/
          cp build_x86_64/x86_64-w64-mingw32/bin/ffmpeg.exe out/ || true
          cp build_x86_64/x86_64-w64-mingw32/bin/ffprobe.exe out/
          ls -laR out

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p logs
          cp -fr $(find build_x86_64 -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") logs || true

      - name: Uploading logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-logs
          path: logs
          retention-days: 7

      - name: Uploading libmpv
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-x86_64
          path: out

      - name: Cleaning build directory
        if: always()
        run: |
          rm -rf build_x86_64/mpv* out logs

      - name: Saving package sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src_packages
          key: ${{ env.PACKAGES_PREFIX }}-sources-${{ github.run_id }}

      - name: Saving packages build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build_x86_64
          key: ${{ env.PACKAGES_PREFIX }}-packages_x86_64-${{ github.run_id }}
